          name: Play Sound on Key 9?
          default: false
          selector:
            boolean:
        action_9:
          name: Action for '9' + Checkmark
          default: []
          selector:
            action: {}

mode: queued

variables:
  target_device: !input keypad_device
  vol_level: !input feedback_volume
  selected_sound: !input feedback_sound
  custom_code_val: !input custom_code
  snd_custom: !input play_sound_custom
  act_custom: !input action_custom
  snd_0: !input play_sound_0
  act_0: !input action_0
  snd_1: !input play_sound_1
  act_1: !input action_1
  snd_2: !input play_sound_2
  act_2: !input action_2
  snd_3: !input play_sound_3
  act_3: !input action_3
  snd_4: !input play_sound_4
  act_4: !input action_4
  snd_5: !input play_sound_5
  act_5: !input action_5
  snd_6: !input play_sound_6
  act_6: !input action_6
  snd_7: !input play_sound_7
  act_7: !input action_7
  snd_8: !input play_sound_8
  act_8: !input action_8
  snd_9: !input play_sound_9
  act_9: !input action_9

trigger:
  - platform: event
    event_type: zwave_js_notification
    event_data:
      command_class: 111 # Entry Control CC
      event_type: 2      # Submit / Enter event

condition:
  - condition: template
    value_template: "{{ trigger.event.data.device_id == target_device }}"
  - condition: template
    value_template: "{{ trigger.event.data.event_data is not none }}"

action:
  - choose:
      # --- Single Digit 0 ---
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.event_data | string == '0' and act_0 != [] }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ snd_0 }}"
            then:
              - action: zwave_js.set_value
                target:
                  device_id: !input keypad_device
                data:
                  command_class: 135
                  endpoint: 0
                  property: "{{ selected_sound | int }}"
                  property_key: 9
                  value: "{{ vol_level | int }}"
          - sequence: !input action_0

      # --- Single Digit 1 ---
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.event_data | string == '1' and act_1 != [] }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ snd_1 }}"
            then:
              - action: zwave_js.set_value
                target:
                  device_id: !input keypad_device
                data:
                  command_class: 135
                  endpoint: 0
                  property: "{{ selected_sound | int }}"
                  property_key: 9
                  value: "{{ vol_level | int }}"
          - sequence: !input action_1

      # --- Single Digit 2 ---
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.event_data | string == '2' and act_2 != [] }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ snd_2 }}"
            then:
              - action: zwave_js.set_value
                target:
                  device_id: !input keypad_device
                data:
                  command_class: 135
                  endpoint: 0
                  property: "{{ selected_sound | int }}"
                  property_key: 9
                  value: "{{ vol_level | int }}"
          - sequence: !input action_2

      # --- Single Digit 3 ---
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.event_data | string == '3' and act_3 != [] }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ snd_3 }}"
            then:
              - action: zwave_js.set_value
                target:
                  device_id: !input keypad_device
                data:
                  command_class: 135
                  endpoint: 0
                  property: "{{ selected_sound | int }}"
                  property_key: 9
                  value: "{{ vol_level | int }}"
          - sequence: !input action_3

      # --- Single Digit 4 ---
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.event_data | string == '4' and act_4 != [] }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ snd_4 }}"
            then:
              - action: zwave_js.set_value
                target:
                  device_id: !input keypad_device
                data:
                  command_class: 135
                  endpoint: 0
                  property: "{{ selected_sound | int }}"
                  property_key: 9
                  value: "{{ vol_level | int }}"
          - sequence: !input action_4

      # --- Single Digit 5 ---
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.event_data | string == '5' and act_5 != [] }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ snd_5 }}"
            then:
              - action: zwave_js.set_value
                target:
                  device_id: !input keypad_device
                data:
                  command_class: 135
                  endpoint: 0
                  property: "{{ selected_sound | int }}"
                  property_key: 9
                  value: "{{ vol_level | int }}"
          - sequence: !input action_5

      # --- Single Digit 6 ---
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.event_data | string == '6' and act_6 != [] }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ snd_6 }}"
            then:
              - action: zwave_js.set_value
                target:
                  device_id: !input keypad_device
                data:
                  command_class: 135
                  endpoint: 0
                  property: "{{ selected_sound | int }}"
                  property_key: 9
                  value: "{{ vol_level | int }}"
          - sequence: !input action_6

      # --- Single Digit 7 ---
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.event_data | string == '7' and act_7 != [] }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ snd_7 }}"
            then:
              - action: zwave_js.set_value
                target:
                  device_id: !input keypad_device
                data:
                  command_class: 135
                  endpoint: 0
                  property: "{{ selected_sound | int }}"
                  property_key: 9
                  value: "{{ vol_level | int }}"
          - sequence: !input action_7

      # --- Single Digit 8 ---
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.event_data | string == '8' and act_8 != [] }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ snd_8 }}"
            then:
              - action: zwave_js.set_value
                target:
                  device_id: !input keypad_device
                data:
                  command_class: 135
                  endpoint: 0

                  property_key: 9
                  value: "{{ vol_level | int }}"
          - sequence: !input action_8

      # --- Single Digit 9 ---
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.event_data | string == '9' and act_9 != [] }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ snd_9 }}"
            then:
              - action: zwave_js.set_value
                target:
                  device_id: !input keypad_device
                data:
                  command_class: 135
                  endpoint: 0
                  property: "{{ selected_sound | int }}"
                  property_key: 9
                  value: "{{ vol_level | int }}"
          - sequence: !input action_9

      # --- Custom Code ---
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.event_data | string == custom_code_val | string and act_custom != [] }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ snd_custom }}"
            then:
              - action: zwave_js.set_value
                target:
                  device_id: !input keypad_device
                data:
                  command_class: 135
                  endpoint: 0
                  property: "{{ selected_sound | int }}"
                  property_key: 9
                  value: "{{ vol_level | int }}"
          - sequence: !input action_custom

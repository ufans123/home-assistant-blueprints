blueprint:
  name: "Ring Keypad V2: Multi-Code Routine Hub"
  description: |
    ### Overview
    Map single digits (0-9) and one custom multi-digit PIN code to separate actions on a Ring Keypad V2. Pressing a shortcut key followed by the Checkmark button triggers your custom actions, operating completely independently of Alarmo. It also includes optional global audio feedback chimes.

    ### Prerequisites
    1. **Z-Wave JS Integration:** Your Home Assistant instance must have the official zwave_js integration running.
    2. **Connected Ring Keypad v2:** The keypad must already be paired to your Z-Wave network.
       **Note:** Ring Keypads require S2 Security during pairing to process Z-Wave Indicator Command Class (135) audio feedback commands correctly.
    3. **Device Selection:** Choose the target Ring Keypad device and configure your desired action slots and global audio preferences below.
  domain: automation
  source_url: https://github.com/ufans123/home-assistant-blueprints/blob/main/ring_keypad_routine.yaml
  input:
    # --- Primary Device Settings ---
    keypad_device:
      name: Ring Keypad
      description: Select your Ring Keypad V2 Z-Wave device.
      selector:
        device:
          integration: zwave_js

    # --- Section: Global Audio Feedback ---
    audio_section:
      name: "Global Audio Feedback Options"
      icon: mdi:volume-high
      description: "Configure confirmation chimes, volume levels, and sound effects."
      collapsed: true
      input:
        feedback_volume:
          name: Confirmation Chime Volume (%)
          description: Set speaker volume for feedback chimes (0 = muted).
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
        feedback_sound:
          name: Feedback Sound Effect
          description: Choose the sound effect to play on successful entries.
          default: "96"
          selector:
            select:
              options:
                - label: "Double Beep (Default)"
                  value: "96"
                - label: "Keytone Click"
                  value: "97"
                - label: "Wind Chime / Doorbell"
                  value: "98"
                - label: "Soft Error Beep"
                  value: "99"

    # --- Section: Custom PIN ---
    custom_code_section:
      name: "Custom / Multi-Digit PIN"
      icon: mdi:numeric
      description: "Configure a custom multi-digit PIN (e.g., 1234) and its action."
      collapsed: true
      input:
        custom_code:
          name: Custom PIN Code
          default: "1234"
          selector:
            text:
        play_sound_custom:
          name: Play Sound on Custom PIN?
          default: false
          selector:
            boolean:
        action_custom:
          name: Custom Code Action
          default: []
          selector:
            action: {}

    # --- Individual Key Sections (0 - 9) ---
    section_key_0:
      name: "Key 0 Action"
      icon: mdi:numeric-0-box-outline
      collapsed: true
      input:
        play_sound_0:
          name: Play Sound on Key 0?
          default: false
          selector:
            boolean:
        action_0:
          name: Action for '0' + Checkmark
          default: []
          selector:
            action: {}

    section_key_1:
      name: "Key 1 Action"
      icon: mdi:numeric-1-box-outline
      collapsed: true
      input:
        play_sound_1:
          name: Play Sound on Key 1?
          default: false
          selector:
            boolean:
        action_1:
          name: Action for '1' + Checkmark
          default: []
          selector:
            action: {}

    section_key_2:
      name: "Key 2 Action"
      icon: mdi:numeric-2-box-outline
      collapsed: true
      input:
        play_sound_2:
          name: Play Sound on Key 2?
          default: false
          selector:
            boolean:
        action_2:
          name: Action for '2' + Checkmark
          default: []
          selector:
            action: {}

    section_key_3:
      name: "Key 3 Action"
      icon: mdi:numeric-3-box-outline
      collapsed: true
      input:
        play_sound_3:
          name: Play Sound on Key 3?
          default: false
          selector:
            boolean:
        action_3:
          name: Action for '3' + Checkmark
          default: []
          selector:
            action: {}

    section_key_4:
      name: "Key 4 Action"
      icon: mdi:numeric-4-box-outline
      collapsed: true
      input:
        play_sound_4:
          name: Play Sound on Key 4?
          default: false
          selector:
            boolean:
        action_4:
          name: Action for '4' + Checkmark
          default: []
          selector:
            action: {}

    section_key_5:
      name: "Key 5 Action"
      icon: mdi:numeric-5-box-outline
      collapsed: true
      input:
        play_sound_5:
          name: Play Sound on Key 5?
          default: false
          selector:
            boolean:
        action_5:
          name: Action for '5' + Checkmark
          default: []
          selector:
            action: {}

    section_key_6:
      name: "Key 6 Action"
      icon: mdi:numeric-6-box-outline
      collapsed: true
      input:
        play_sound_6:
          name: Play Sound on Key 6?
          default: false
          selector:
            boolean:
        action_6:
          name: Action for '6' + Checkmark
          default: []
          selector:
            action: {}

    section_key_7:
      name: "Key 7 Action"
      icon: mdi:numeric-7-box-outline
      collapsed: true
      input:
        play_sound_7:
          name: Play Sound on Key 7?
          default: false
          selector:
            boolean:
        action_7:
          name: Action for '7' + Checkmark
          default: []
          selector:
            action: {}

    section_key_8:
      name: "Key 8 Action"
      icon: mdi:numeric-8-box-outline
      collapsed: true
      input:
        play_sound_8:
          name: Play Sound on Key 8?
          default: false

blueprint:
  name: Button Scene Cycling and Off Control
  description: >
    Cycles sequentially through scenes with an On/Scene button, and turns off target devices 
    and resets the counter with an Off button. Supports up to 3 optional On and Off buttons.

    **Version:** v1.1
  domain: automation
  source_url: https://github.com/ufans123/home-assistant-blueprints/blob/main/button_scene_cycling_and_off_control.yaml
  author: Ufans123
  input:
    on_button_config:
      name: On / Scene Buttons
      description: Configure your primary and optional scene cycling buttons.
      icon: mdi:power
      input:
        on_button:
          name: On Button (Primary)
          description: The primary event entity for cycling through scenes.
          selector:
            entity:
              domain:
                - event
              multiple: false
              reorder: false
        on_button_2:
          name: On Button 2 (Optional)
          description: Optional second event entity for cycling through scenes.
          default: []
          selector:
            entity:
              domain:
                - event
              multiple: false
              reorder: false
        on_button_3:
          name: On Button 3 (Optional)
          description: Optional third event entity for cycling through scenes.
          default: []
          selector:
            entity:
              domain:
                - event
              multiple: false
              reorder: false
    off_button_config:
      name: Off / Shutdown Buttons
      description: Configure your primary and optional shutdown/reset buttons.
      icon: mdi:power-off
      input:
        off_button:
          name: Off Button (Primary)
          description: The primary event entity for turning off target devices.
          selector:
            entity:
              domain:
                - event
              multiple: false
              reorder: false
        off_button_2:
          name: Off Button 2 (Optional)
          description: Optional second event entity for turning off target devices.
          default: []
          selector:
            entity:
              domain:
                - event
              multiple: false
              reorder: false
        off_button_3:
          name: Off Button 3 (Optional)
          description: Optional third event entity for turning off target devices.
          default: []
          selector:
            entity:
              domain:
                - event
              multiple: false
              reorder: false
    scene_config:
      name: Scene Selection
      description: Choose and reorder the scenes for your rotation cycle.
      icon: mdi:playlist-play
      input:
        scene_list:
          name: Scenes to Cycle
          description: Select and reorder the scenes you want to cycle through in sequence.
          selector:
            entity:
              domain: scene
              multiple: true
              reorder: true
    target_config:
      name: Targets & Helpers
      description: Configure devices to turn off and the tracking counter helper.
      icon: mdi:devices
      input:
        target_entity:
          name: Target Devices for Off Button
          description: The switches, lights, or devices to turn off when off is pressed.
          selector:
            target:
              entity:
                - domain:
                    - switch
                    - light
                    - input_boolean
        counter_entity:
          name: Counter Helper
          description: Select your Counter helper to remember your place in the cycle.
          selector:
            entity:
              domain: counter

mode: single
max_exceeded: silent

triggers:
  - trigger: event.received
    target:
      entity_id: !input on_button
    options:
      event_type:
        - initial_press
        - multi_press_1
    id: turn_on
  - trigger: event.received
    target:
      entity_id: !input on_button_2
    options:
      event_type:
        - initial_press
        - multi_press_1
    id: turn_on
  - trigger: event.received
    target:
      entity_id: !input on_button_3
    options:
      event_type:
        - initial_press
        - multi_press_1
    id: turn_on
  - trigger: event.received
    target:
      entity_id: !input off_button
    options:
      event_type:
        - initial_press
        - multi_press_1
    id: turn_off
  - trigger: event.received
    target:
      entity_id: !input off_button_2
    options:
      event_type:
        - initial_press
        - multi_press_1
    id: turn_off
  - trigger: event.received
    target:
      entity_id: !input off_button_3
    options:
      event_type:
        - initial_press
        - multi_press_1
    id: turn_off

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: turn_on
        sequence:
          - variables:
              scenes: !input scene_list
              counter: !input counter_entity
              total_scenes: "{{ scenes | length }}"
              current_count: "{{ states(counter) | int(0) }}"
              next_index: "{{ current_count % total_scenes }}"
              target_scene: "{{ scenes[next_index] }}"

          - action: scene.turn_on
            target:
              entity_id: "{{ target_scene }}"

          - action: counter.increment
            target:
              entity_id: !input counter_entity

      - conditions:
          - condition: trigger
            id: turn_off
        sequence:
          - action: homeassistant.turn_off
            target: !input target_entity

          - action: counter.reset
            target:
              entity_id: !input counter_entity

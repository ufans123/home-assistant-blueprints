blueprint:
  name: Sync Device and Scheduled Off-Time
  description: 'Syncs a target device (light, switch, fan) with a scheduled turn-off time picker. Optionally pairs with a timer helper for dashboard tracking. Turning the device on calculates the duration from now until the off-time and starts the timer (if provided). Turning it off cancels the timer, and when the time or timer expires, the device turns off.'
  domain: automation
  source_url: https://github.com/ufans123/home-assistant-blueprints/blob/main/device_sync_scheduled_time_off.yaml
  author: Ufans123
  input:
    controlled_device:
      name: Target Device
      description: The switch, light, or fan to control and sync.
      selector:
        entity:
          domain:
            - light
            - switch
            - fan
          multiple: false
          reorder: false
    turn_off_time:
      name: Target Turn-Off Time
      description: Select the time of day when the device should turn off. The timer duration will dynamically calculate the seconds from now until this time.
      selector:
        time: {}
    target_timer:
      name: Optional Timer Helper
      description: Optional timer helper used to track duration for dashboard cards. Leave blank if you don't use a timer.
      default: ''
      selector:
        entity:
          domain:
            - timer
          multiple: false
          reorder: false

mode: single
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input controlled_device
    to: 'on'
    id: device_on
  - platform: state
    entity_id: !input controlled_device
    to: 'off'
    id: device_off
  - platform: state
    entity_id: !input target_timer
    from: active
    to: idle
    id: timer_finished

action:
  - choose:
      - conditions:
          - condition: trigger
            id: device_on
        sequence:
          # Calculate dynamic duration based on target turn_off_time input
          - variables:
              off_str: !input turn_off_time
              timer_entity: !input target_timer
              calculated_duration: >-
                {% set now_ts = now().timestamp() %}
                {% set off_ts = today_at(off_str).timestamp() %}
                {% set diff = off_ts - now_ts %}
                {{ (diff + 86400) if diff < 0 else diff | int }}
          # Start the timer only if a timer entity was provided
          - if:
              - condition: template
                value_template: "{{ timer_entity not in [none, '', 'unknown', 'unavailable'] }}"
            then:
              - if:
                  - condition: state
                    entity_id: !input target_timer
                    state: idle
                then:
                  - action: timer.start
                    target:
                      entity_id: !input target_timer
                    data:
                      duration: '{{ calculated_duration }}'
      - conditions:
          - condition: trigger
            id: device_off
        sequence:
          # Cancel timer if provided and active
          - variables:
              timer_entity: !input target_timer
          - if:
              - condition: template
                value_template: "{{ timer_entity not in [none, '', 'unknown', 'unavailable'] }}"
            then:
              - if:
                  - condition: state
                    entity_id: !input target_timer
                    state: active
                then:
                  - action: timer.cancel
                    target:
                      entity_id: !input target_timer
      - conditions:
          - condition: trigger
            id: timer_finished
        sequence:
          - if:
              - condition: state
                entity_id: !input controlled_device
                state: 'on'
            then:
              - action: homeassistant.turn_off
                target:
                  entity_id: !input controlled_device

blueprint:
  name: Dashboard-Controlled Daily Device Scheduler
  description: >-
    Turns a device on/off based on dashboard input_datetime helpers, selected
    days, an optional enable/disable toggle, and optional timer synchronization.
  domain: automation
  source_url: https://github.com/ufans123/home-assistant-blueprints/blob/main/dashboard_controlled_daily_device_scheduler.yaml
  author: Ufans123
  input:
    target_device:
      name: Device to Control
      description: The switch, light, or fan entity to be controlled by this schedule.
      selector:
        entity:
          domain:
          - switch
          - light
          - fan
          multiple: false
          reorder: false
    on_time_helper:
      name: Turn On Time Helper
      description: Select an input_datetime helper (time-based) that you adjust from your dashboard.
      selector:
        entity:
          domain:
          - input_datetime
          multiple: false
          reorder: false
    off_time_helper:
      name: Turn Off Time Helper
      description: Select an input_datetime helper (time-based) that you adjust from your dashboard.
      selector:
        entity:
          domain:
          - input_datetime
          multiple: false
          reorder: false
    enable_switch:
      name: Enable/Disable Switch (Optional)
      description: Optional input_boolean helper to master-enable or disable this schedule from your dashboard. Leave blank to always enable.
      selector:
        entity:
          domain:
          - input_boolean
          multiple: false
          reorder: false
      default: ''
    timer_entity:
      name: Timer Helper (Optional)
      description: Optional timer helper (timer.*) to track countdowns. Leave blank to disable timer features.
      selector:
        entity:
          domain:
          - timer
          multiple: false
          reorder: false
      default: ''
    days_section:
      name: Active Days of the Week
      icon: mdi:calendar-week
      collapsed: true
      description: Defaults to every day. Expand to customize specific active days.
      input:
        day_mon:
          name: Monday
          description: Enable or disable the schedule for Mondays.
          selector:
            boolean: {}
          default: true
        day_tue:
          name: Tuesday
          description: Enable or disable the schedule for Tuesdays.
          selector:
            boolean: {}
          default: true
        day_wed:
          name: Wednesday
          description: Enable or disable the schedule for Wednesdays.
          selector:
            boolean: {}
          default: true
        day_thu:
          name: Thursday
          description: Enable or disable the schedule for Thursdays.
          selector:
            boolean: {}
          default: true
        day_fri:
          name: Friday
          description: Enable or disable the schedule for Fridays.
          selector:
            boolean: {}
          default: true
        day_sat:
          name: Saturday
          description: Enable or disable the schedule for Saturdays.
          selector:
            boolean: {}
          default: true
        day_sun:
          name: Sunday
          description: Enable or disable the schedule for Sundays.
          selector:
            boolean: {}
          default: true
alias: 'Dashboard-Controlled Daily Device Scheduler'
description: Turns a device on/off based on dashboard input_datetime helpers and selected days.
trigger:
- trigger: template
  value_template: >-
    {% set helper = states('%s' | format(states('input_datetime.dummy') if false else '')) %}
    {% set on_h = '%s' | format(states(on_input_ent)) %}
    {{ on_h != 'unknown' and on_h != 'unavailable' and now().strftime('%H:%M:%S') == on_h }}
  variables:
    on_input_ent: !input on_time_helper
  id: turn_on
- trigger: template
  value_template: >-
    {% set off_h = '%s' | format(states(off_input_ent)) %}
    {{ off_h != 'unknown' and off_h != 'unavailable' and now().strftime('%H:%M:%S') == off_h }}
  variables:
    off_input_ent: !input off_time_helper
  id: turn_off
- trigger: event
  event_type: timer.finished
  id: timer_finished
- trigger: event
  event_type: timer.cancelled
  id: timer_cancelled
- trigger: state
  entity_id: !input target_device
  from: 'off'
  to: 'on'
  id: device_on
- trigger: state
  entity_id: !input target_device
  to: 'off'
  id: device_off
- trigger: homeassistant
  event: start
  id: ha_rebooted
action:
- variables:
    target_dev: !input target_device
    on_input: !input on_time_helper
    off_input: !input off_time_helper
    enable_ent: !input enable_switch
    timer_ent: !input timer_entity
    d_mon: !input day_mon
    d_tue: !input day_tue
    d_wed: !input day_wed
    d_thu: !input day_thu
    d_fri: !input day_fri
    d_sat: !input day_sat
    d_sun: !input day_sun
    today_enabled: >-
      {% set day = now().strftime('%a') | lower %}
      {% set day_ok = (day == 'mon' and d_mon) or (day == 'tue' and d_tue) or (day == 'wed' and d_wed) or (day == 'thu' and d_thu) or (day == 'fri' and d_fri) or (day == 'sat' and d_sat) or (day == 'sun' and d_sun) %}
      {% set switch_ok = states(enable_ent) == 'on' if enable_ent is not none and enable_ent | string | length > 0 else true %}
      {{ day_ok and switch_ok }}
- choose:
  - conditions:
    - condition: trigger
      id: turn_on
    - condition: template
      value_template: '{{ today_enabled }}'
    sequence:
    - action: homeassistant.turn_on
      target:
        entity_id: '{{ target_dev }}'
    - if:
      - condition: template
        value_template: '{{ timer_ent is not none and timer_ent | string | length > 0 }}'
      then:
      - action: timer.start
        target:
          entity_id: '{{ timer_ent }}'
        data:
          duration: >
            {% set on_val = states(on_input) %}
            {% set off_val = states(off_input) %}
            {% set on_parts = on_val.split(':') %}
            {% set off_parts = off_val.split(':') %}
            {% set on_sec = (on_parts[0] | int * 3600) + (on_parts[1] | int * 60) + (on_parts[2] | float | int if on_parts | length > 2 else 0) %}
            {% set off_sec = (off_parts[0] | int * 3600) + (off_parts[1] | int * 60) + (off_parts[2] | float | int if off_parts | length > 2 else 0) %}
            {% set diff = off_sec - on_sec %}
            {% set diff = diff + 86400 if diff < 0 else diff %}
            {{ diff }}
  - conditions:
    - condition: trigger
      id: turn_off
    sequence:
    - action: homeassistant.turn_off
      target:
        entity_id: '{{ target_dev }}'
    - if:
      - condition: template
        value_template: '{{ timer_ent is not none and timer_ent | string | length > 0 }}'
      then:
      - action: timer.cancel
        target:
          entity_id: '{{ timer_ent }}'
  - conditions:
    - condition: trigger
      id: timer_finished
    - condition: template
      value_template: '{{ timer_ent is not none and timer_ent | string | length > 0 and trigger.event.data.entity_id == timer_ent }}'
    sequence:
    - action: homeassistant.turn_off
      target:
        entity_id: '{{ target_dev }}'
  - conditions:
    - condition: trigger
      id: timer_cancelled
    - condition: template
      value_template: '{{ timer_ent is not none and timer_ent | string | length > 0 and trigger.event.data.entity_id == timer_ent }}'
    sequence:
    - action: homeassistant.turn_off
      target:
        entity_id: '{{ target_dev }}'
  - conditions:
    - condition: trigger
      id: device_on
    - condition: template
      value_template: '{{ timer_ent is not none and timer_ent | string | length > 0 and states(timer_ent) == "idle" }}'
    sequence:
    - action: timer.start
      target:
        entity_id: '{{ timer_ent }}'
      data:
        duration: >
          {% set off_val = states(off_input) %}
          {% set off_parts = off_val.split(':') %}
          {% set off_sec = (off_parts[0] | int * 3600) + (off_parts[1] | int * 60) + (off_parts[2] | float | int if off_parts | length > 2 else 0) %}
          {% set now_sec = (now().hour * 3600) + (now().minute * 60) + now().second %}
          {% set diff = off_sec - now_sec %}
          {% set diff = diff + 86400 if diff < 0 else diff %}
          {{ diff }}
  - conditions:
    - condition: trigger
      id: device_off
    sequence:
    - if:
      - condition: template
        value_template: '{{ timer_ent is not none and timer_ent | string | length > 0 }}'
      then:
      - action: timer.cancel
        target:
          entity_id: '{{ timer_ent }}'
  - conditions:
    - condition: trigger
      id: ha_rebooted
    - condition: template
      value_template: '{{ states(target_dev) == "on" }}'
    - condition: template
      value_template: '{{ timer_ent is not none and timer_ent | string | length > 0 and states(timer_ent) == "idle" }}'
    sequence:
    - action: timer.start
      target:
        entity_id: '{{ timer_ent }}'
      data:
        duration: >
          {% set off_val = states(off_input) %}
          {% set off_parts = off_val.split(':') %}
          {% set off_sec = (off_parts[0] | int * 3600) + (off_parts[1] | int * 60) + (off_parts[2] | float | int if off_parts | length > 2 else 0) %}
          {% set now_sec = (now().hour * 3600) + (now().minute * 60) + now().second %}
          {% set diff = off_sec - now_sec %}
          {% set diff = diff + 86400 if diff < 0 else diff %}
          {{ diff }}
mode: single
